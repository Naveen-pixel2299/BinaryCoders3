<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Local Video Player</title>

    <!-- Load Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Optional: Load Phosphor Icons for modern iconography -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            /* Tailwind slate-900 */
            background-image: radial-gradient(circle at 50% -20%, #1e293b, #0f172a);
        }

        /* Customize video controls slightly for webkit browsers */
        video::-webkit-media-controls-panel {
            background-color: rgba(15, 23, 42, 0.7);
            border-radius: 0 0 1rem 1rem;
        }
    </style>
</head>

<body class="min-h-screen text-slate-200 flex flex-col items-center justify-center p-4 sm:p-8">

    <main
        class="w-full max-w-4xl bg-slate-800/50 backdrop-blur-xl border border-slate-700 rounded-3xl shadow-2xl overflow-hidden flex flex-col transition-all duration-500">

        <!-- Header -->
        <header class="p-6 border-b border-slate-700/50 flex items-center gap-3">
            <i class="ph ph-play-circle text-3xl text-indigo-400"></i>
            <div>
                <h1 class="text-xl font-semibold text-white tracking-wide">Nexus Media Player</h1>
                <p class="text-sm text-slate-400">Enjoy your video playback</p>
            </div>
        </header>

        <div class="p-6 sm:p-8 flex flex-col gap-6">

            <!-- Video Player Container (Visible by default) -->
            <div id="player-container"
                class="relative w-full bg-black rounded-2xl overflow-hidden shadow-inner ring-1 ring-white/10">

                <!-- File Name Display (Overlay) -->
                <div
                    class="absolute top-0 left-0 w-full p-4 bg-gradient-to-b from-black/80 to-transparent z-10 opacity-0 hover:opacity-100 transition-opacity duration-300 pointer-events-none flex justify-between items-start">
                    <div class="flex items-center gap-2 text-white/90 drop-shadow-md">
                        <i class="ph ph-film-strip"></i>
                        <span id="current-file-name" class="text-sm font-medium truncate max-w-[200px] sm:max-w-md">My
                            Video</span>
                    </div>
                </div>

                <!-- HTML5 Video Element -->
                <!-- Replace 'your-video-file.mp4' with the actual path to your file -->
                <video id="video-player" class="w-full h-auto aspect-video object-contain" controls
                    controlsList="nodownload" preload="metadata" src="solar_cool_sih.mp4">
                    Your browser does not support the video tag.
                </video>
            </div>

        </div>
    </main>
</body>

</html>
